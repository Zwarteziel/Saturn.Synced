; Saturn.Synced 1.3 settings - high framerate mod for Hardwar
; Place this file together with dinput8.dll in the folder that contains HardwarW.exe.

[FPS]
; Target frame rate for single-player (original: 27).
; Set to 27 to play with the original frame rate without removing the mod.
; Recommended: 60, or your monitor's refresh rate (e.g. 120/144).
; 0 = no limit (not recommended: frames with dt = 0 ms and 100% CPU usage).
TargetFPS=60

; Frame rate in network games. 0 = leave at the original 20 fps.
; Keep this at 0 unless every player uses the same setting.
NetGameFPS=0

; The last part of each frame wait is spent spinning for accurate pacing.
; Higher = more even frame times, slightly more CPU. 1-3 is fine.
SpinMs=2

; Write saturn_synced.log (startup and patch status).
Log=1

; 1 = also write the measured fps / game-time line every 10 seconds, and a
; line whenever a moth or pilot record is kept by SafeDelete.
; 0 = only log startup and patch status.
Verbose=0

; Fix for AI moths queuing in front of hangar entrances at higher frame rates.
; The game ignores very small steering movements per frame; at more frames per
; second, fine turns fall below that limit and AI pilots cannot line up with
; the entrance. 1 = scale that limit with the frame time (recommended), 0 = off.
FixAITurning=1

; Moves objects with exact precision. The game rounds every movement step down
; to whole units; at high frame rates the steps get so small that slow objects
; (such as AI moths creeping into a hangar) stop moving altogether.
; 1 = keep the rounding leftovers so movement is exact at any frame rate
; (recommended above 60 fps), 0 = original rounding.
PreciseMovement=0

[AI]
; How many times per second computer pilots update their controls and steering.
; The game's pilot code was tuned for the original frame rate (about 25-27
; updates per second); at higher rates AI moths can get stuck lining up with
; or creeping into hangar entrances. 25 = recommended. Their movement on screen
; stays smooth; only their steering decisions run at this rate. Your own moth
; always updates every frame. 0 = update AI pilots every frame (not recommended).
AIUpdateRate=25

[Stability]
; Fix for crashes caused by the game itself: when a moth or pilot is removed
; from the game (trade-in, death, ...), some AI plans keep pointing at it.
; 1 = keep the removed record as an inert "not in the world" entry, so those
; plans end normally instead of reading freed memory (recommended), 0 = off.
SafeDelete=1

; Fix for crashes caused by the game itself: computer pilots follow "plans"
; (attack a moth, fly to a building, ...). Some plans can keep pointing at a
; moth, pilot or building that no longer exists. 1 = check the plan before the
; game runs it and drop it if its target is gone (recommended), 0 = off.
PlanCheck=1

[Debug]
; 1 = write saturn_synced_crash.log when the game crashes to the desktop
; (exception, location in the game code, registers, stack, mod state).
CrashLog=1

; 1 = recover from known crashes in the game's own AI code (an AI pilot
; holding a pointer to another moth or building that no longer exists).
; Each recovery is logged in saturn_synced_crash.log as a [guard] line.
CrashGuard=1

[Proxy]
; Already using another dinput8.dll wrapper? Rename it (e.g. to
; dinput8_chain.dll) and enter its name here; it will be loaded in turn.
ChainDll=
